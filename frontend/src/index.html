<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>UTE Vice — Gestión Académica</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Plataforma de gestion y validacion de titulos universitarios del personal de la Universidad Tecnologica Equinoccial"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <script>
      // Configuracion inyectable en despliegue: permite apuntar la misma
      // imagen a otro backend sin reconstruir el paquete.
      window.__env = window.__env || {};

      // El tema se aplica antes de pintar para evitar el destello de tema claro
      // en quien tiene preferencia oscura.
      (function () {
        try {
          var guardado = localStorage.getItem('ute_vice_tema');
          var oscuro =
            guardado === 'oscuro' ||
            (!guardado && matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.setAttribute('data-tema', 'oscuro');
        } catch (e) {
          /* almacenamiento bloqueado: se usa el tema claro */
        }
      })();
    </script>
  </head>
  <body>
    <ute-raiz></ute-raiz>
  </body>
</html>
