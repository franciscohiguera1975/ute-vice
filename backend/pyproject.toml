[project]
name = "ute-vice-backend"
version = "0.8.0"
description = "Gestion y validacion de titulos universitarios del personal de la UTE"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # --- Web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    # --- Configuracion y validacion ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # --- Persistencia ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # --- Seguridad ---
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    # --- Integraciones ---
    "httpx>=0.28",
    # --- Reportes ---
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
ldap = ["ldap3>=2.9"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff
    "ASYNC",    # errores async
]
ignore = [
    # `Depends()` en un argumento por defecto es el idioma de FastAPI.
    "B008",
    # Nuestras excepciones de dominio no terminan en "Error": la convencion es
    # deliberada y consistente (`NoEncontrado`, `ConflictoDeEstado`).
    "N818",
    # `Generic[T]` en lugar de la sintaxis PEP 695 `class Pagina[T]`. Se prefiere
    # la forma explicita: es la que reconoce cualquiera que lea el codigo, y
    # PEP 695 combinado con dataclasses todavia tiene aristas.
    "UP046",
    # La raya (–) en la prosa en espanol es tipografia intencional, no un guion
    # mal copiado. La documentacion del proyecto la usa de forma consistente.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "N999"]
"tests/*" = ["E501"]
# `PgUUID` es el alias convencional del tipo UUID de PostgreSQL en SQLAlchemy.
# Distinguirlo de `uuid.UUID` en el mismo archivo es mas claro que cualquier
# nombre que respete la convencion de constantes.
"src/app/infrastructure/db/modelos.py" = ["N811"]
"src/app/infrastructure/db/modelos_distributivo.py" = ["N811"]

# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ldap3.*", "openpyxl.*", "reportlab.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------
[tool.pytest.ini_options]
# La raiz del proyecto va en la ruta ademas de `src` porque varias pruebas
# importan utilidades compartidas con `from tests.conftest import ...`. Sin
# ella eso solo funciona al invocar `python -m pytest`, que agrega el
# directorio actual por su cuenta; con `pytest` a secas —como lo llaman el
# Makefile y la integracion continua— la coleccion falla entera.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: pruebas puras de dominio y casos de uso (sin E/S)",
    "integration: pruebas que tocan base de datos o la API completa",
]

[tool.coverage.run]
source = ["src/app"]
omit = ["*/alembic/*", "*/__init__.py"]
