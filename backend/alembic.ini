# Configuracion de Alembic para UTE-VICE.
# La URL de conexion NO se escribe aqui: la resuelve `alembic/env.py` a partir
# de las variables de entorno, para no versionar credenciales.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
timezone = UTC

# Las revisiones llevan fecha en el nombre: el orden cronologico es evidente
# al listar la carpeta.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
