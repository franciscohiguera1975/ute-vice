# =====================================================================
# vice-gestion.uaeftt-ute.site — UTE Vice · Gestion Academica
# =====================================================================
# El frontend son archivos estaticos servidos directamente por este nginx;
# la API va por proxy al contenedor, que solo escucha en 127.0.0.1.
#
# Certbot agrega el bloque 443 y la redireccion al ejecutarse. Este archivo
# es el punto de partida en :80, suficiente para el desafio ACME.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name vice-gestion.uaeftt-ute.site;

    root /opt/vice-gestion/frontend;
    index index.html;

    access_log /var/log/nginx/vice-gestion.access.log;
    error_log  /var/log/nginx/vice-gestion.error.log;

    # Los reportes en Excel de un periodo completo pesan; y la importacion
    # del consolidado sube un .xlsx de varios megas.
    client_max_body_size 32m;

    # --- API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generar el consolidado de un periodo tarda mas que el minuto por
        # omision de nginx.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # La descarga se arma entera en memoria del backend: pasarla tal cual
        # evita que nginx la vuelva a bufferizar en disco.
        proxy_buffering off;
    }

    # Documentacion de la API y sondeo de salud, bajo el mismo proxy.
    location = /health { proxy_pass http://127.0.0.1:8100/health; }
    location /docs     { proxy_pass http://127.0.0.1:8100; }
    location /openapi.json { proxy_pass http://127.0.0.1:8100/openapi.json; }

    # --- Frontend ----------------------------------------------------
    # Los archivos con huella en el nombre no cambian nunca: se cachean por
    # un ano. `index.html` no, porque es quien apunta a la version nueva.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular resuelve el enrutado en el cliente: cualquier ruta desconocida
    # devuelve la aplicacion, no un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Cabeceras de seguridad --------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
