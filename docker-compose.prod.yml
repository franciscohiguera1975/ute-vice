# =====================================================================
# Despliegue de produccion — UTE Vice · Gestion Academica
# =====================================================================
# Dos contenedores y nada mas: el frontend son archivos estaticos que sirve
# el nginx del host. En un VPS de 1,8 GB compartido con otras aplicaciones,
# cada contenedor que no hace falta es memoria que se le quita al resto.
#
# Los puertos se publican **solo en 127.0.0.1**: al exterior se llega por el
# nginx del host, que es quien termina TLS. Nada de esto queda expuesto en
# la interfaz publica.
# =====================================================================

name: ute-vice

services:
  postgres:
    image: postgres:18-alpine
    container_name: vice_gestion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Guayaquil}
      PGTZ: ${TZ:-America/Guayaquil}
    ports:
      - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5437}:5432"
    volumes:
      # PostgreSQL 18 cambio la convencion: el volumen va en
      # `/var/lib/postgresql` y la imagen coloca los datos en un subdirectorio
      # con la version (`18/docker`). Montar en `/data`, como en 16 y
      # anteriores, hace que el contenedor se niegue a arrancar.
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [vice_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: ute-vice-backend:prod
    container_name: vice_gestion_backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:${BACKEND_EXTERNAL_PORT:-8100}:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    # Dos trabajadores, no cuatro: con 1,8 GB compartidos, cuatro procesos de
    # uvicorn compiten con las demas aplicaciones del servidor.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [vice_net]

volumes:
  postgres_data:
    name: vice_gestion_postgres_data
  backend_storage:
    name: vice_gestion_backend_storage

networks:
  vice_net:
    name: vice_gestion_net
    driver: bridge
